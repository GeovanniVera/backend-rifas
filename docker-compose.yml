services:
  postgres:
    image: postgres:16-alpine
    container_name: tienda_rifas_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda_rifas_db}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_rifas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tienda_rifas_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tienda_rifas_user} -d ${POSTGRES_DB:-tienda_rifas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: tienda_rifas_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda_rifas_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tienda_rifas_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tienda_rifas_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tienda_rifas_pass}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  postgres_data:
    driver: local
